name: Update Scholar numbers

on:
  schedule:
    - cron: "17 9 * * *" # every day, 09:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read Google Scholar
        run: node scripts/update-scholar.mjs

      - name: Did the numbers change?
        id: diff
        run: |
          if git diff --quiet -- src/scholar.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the new numbers
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scholar.json
          git commit -m "Update Google Scholar numbers"
          git push

      - name: Build the site
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm install --no-audit --no-fund
          CI=false npm run build

      - name: Publish the site
        if: steps.diff.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build
