<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icons/emon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") {
            t = "light";
          }
          document.documentElement.setAttribute("data-mode", t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Bengali:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f4f6fb" />
    <meta
      name="description"
      content="Mahfuzur Rahman Emon, M.Sc. student in the LASSO Lab at the University of Calgary (on leave from SUST). Research on software build systems, CI/CD and software release."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/emon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Mahfuzur Rahman Emon - Software Engineering Researcher, University of Calgary</title>
  </head>

  </body>
</html>
